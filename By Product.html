<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>By Product</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: left GNB (create + ordered project list) · right: selected project page with tabs. */
:root{
  --bg:#F5F5F0; --surface:#FFFFFF; --surface-2:#EDEDE5; --side:#EFEFE8; --border:#DFDED3;
  --text:#1B221E; --text-dim:#59635B; --text-faint:#879086;
  --accent:#1F6F5C; --accent-strong:#154F41; --accent-tint:#E3EFEA; --danger:#A83A2C; --danger-tint:#F8E4E0;
  --shadow:0 1px 2px rgba(27,34,30,.06),0 8px 24px -14px rgba(27,34,30,.14);
  --c-gray-bg:#EEEEE8; --c-gray-fg:#4A524C;
  --c-green-bg:#E1F0E8; --c-green-fg:#1D6B4F;
  --c-blue-bg:#E2ECF8; --c-blue-fg:#2A5A94;
  --c-yellow-bg:#FAF1D2; --c-yellow-fg:#86620C;
  --c-orange-bg:#FBE7D8; --c-orange-fg:#9A4A17;
  --c-red-bg:#F8E1DE; --c-red-fg:#9E3527;
  --c-purple-bg:#ECE5F6; --c-purple-fg:#5D3F8E;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --serif:'Noto Serif KR',ui-serif,Georgia,serif;
  --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12140F; --surface:#1B1E17; --surface-2:#23271F; --side:#171A14; --border:#343B30;
    --text:#EEF0E8; --text-dim:#A7B0A0; --text-faint:#78816F;
    --accent:#57C4A2; --accent-strong:#7BD9BA; --accent-tint:#1E332C; --danger:#EE8C7E; --danger-tint:#3B1E19;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.55);
    --c-gray-bg:#262A23; --c-gray-fg:#C6CCC0;
    --c-green-bg:#1C3329; --c-green-fg:#8FD9B6;
    --c-blue-bg:#1B2A3D; --c-blue-fg:#9CC1EE;
    --c-yellow-bg:#352D14; --c-yellow-fg:#E8CB78;
    --c-orange-bg:#3A2616; --c-orange-fg:#F0B083;
    --c-red-bg:#3B1F1B; --c-red-fg:#F0A095;
    --c-purple-bg:#2C2338; --c-purple-fg:#C7B2EC;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12140F; --surface:#1B1E17; --surface-2:#23271F; --side:#171A14; --border:#343B30;
  --text:#EEF0E8; --text-dim:#A7B0A0; --text-faint:#78816F;
  --accent:#57C4A2; --accent-strong:#7BD9BA; --accent-tint:#1E332C; --danger:#EE8C7E; --danger-tint:#3B1E19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.55);
  --c-gray-bg:#262A23; --c-gray-fg:#C6CCC0;
  --c-green-bg:#1C3329; --c-green-fg:#8FD9B6;
  --c-blue-bg:#1B2A3D; --c-blue-fg:#9CC1EE;
  --c-yellow-bg:#352D14; --c-yellow-fg:#E8CB78;
  --c-orange-bg:#3A2616; --c-orange-fg:#F0B083;
  --c-red-bg:#3B1F1B; --c-red-fg:#F0A095;
  --c-purple-bg:#2C2338; --c-purple-fg:#C7B2EC;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.65}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100%}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr)}}

/* ---------- GNB ---------- */
.gnb{background:var(--side);border-right:1px solid var(--border);padding:24px 14px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
@media (max-width:760px){.gnb{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border)}}
.brand{padding:0 6px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.brand h1{font-family:var(--serif);font-weight:700;font-size:22px;margin:0;letter-spacing:-.01em}
.create{display:flex;gap:6px}
.field{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 12px;outline:none;width:100%;min-width:0;font-size:14px}
.field:focus{border-color:var(--accent)}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover{background:var(--accent-strong)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-dim);padding:6px 10px;font-size:13.5px}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger-tint);color:var(--danger)}
.list-label{font-size:11.5px;font-weight:600;letter-spacing:.08em;color:var(--text-faint);text-transform:uppercase;display:flex;align-items:center;gap:6px;padding:0 0 0 6px;min-height:28px;position:relative}
.list-label .lbl{flex:1}
.more{border:0;background:transparent;color:var(--text-dim);width:26px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;opacity:0;flex:none;padding:0}
.more svg{width:16px;height:16px;fill:currentColor}
.more:hover,.more[aria-expanded="true"]{background:var(--border);color:var(--text)}
.list-label:hover .more,.list-label:focus-within .more,.pitem:hover .more,.pitem:focus-within .more,.more[aria-expanded="true"]{opacity:1}
@media (hover:none){.more{opacity:.7}}
.menu{position:fixed;z-index:20;min-width:160px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px -10px rgba(0,0,0,.3);padding:4px;display:flex;flex-direction:column;text-transform:none;letter-spacing:0}
.menu button{border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:8px}
.menu button:hover,.menu button:focus-visible{background:var(--surface-2);outline:none}
.menu button.danger{color:var(--danger)}
.menu svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;flex:none}
.pin{width:12px;height:12px;flex:none;color:var(--accent);fill:currentColor}
.group-label{font-size:11px;font-weight:600;color:var(--text-faint);padding:6px 8px 2px;letter-spacing:.04em}
.group-gap{height:1px;background:var(--border);margin:6px 8px}
.pitem.divider{min-height:22px}
.pitem.divider .rule{flex:1;height:1px;background:var(--text-faint);opacity:.45;margin:0 6px}
.pitem.divider:hover .rule{opacity:.8}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.pitem{display:flex;align-items:center;gap:2px;border-radius:8px}
.pitem:hover,.pitem:focus-within{background:var(--surface-2)}
.pitem.active{background:var(--surface);box-shadow:var(--shadow)}
.pbtn{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:7px 8px;display:flex;align-items:center;gap:10px;border-radius:8px}
.pbtn .no{display:none}
.pbtn .name{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem.active .pbtn .name{font-weight:700}
.grip{flex:none;width:22px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-faint);opacity:0;cursor:grab;touch-action:none;border-radius:6px;font-size:13px;letter-spacing:-2px;user-select:none}
.pitem:hover .grip,.pitem:focus-within .grip{opacity:1}
@media (hover:none){.grip{opacity:.7}}
.plist.sorting{cursor:grabbing}
.plist.sorting .pbtn{cursor:grabbing}
.pitem.dragging{background:var(--surface);box-shadow:0 6px 18px -6px rgba(0,0,0,.25);position:relative;z-index:2}
.pitem.dragging .grip{opacity:1;color:var(--accent)}
.pitem{user-select:none}
.drag-hint{font-size:12px;color:var(--text-faint);padding:0 6px}
.side-empty{font-size:13px;color:var(--text-faint);padding:4px 6px}

/* ---------- 본문 ---------- */
.main{padding-inline:clamp(16px,5vw,56px);padding-block:40px 80px;min-width:0}
.page{max-width:820px;display:flex;flex-direction:column;gap:18px}
.welcome{max-width:520px;display:flex;flex-direction:column;gap:8px;padding-top:40px}
.welcome h2{font-family:var(--serif);font-size:26px;margin:0}
.welcome p{margin:0;color:var(--text-dim)}
.ptitle{font-family:var(--serif);font-weight:700;font-size:clamp(28px,4vw,38px);border:0;background:transparent;outline:none;width:100%;padding:0;letter-spacing:-.01em}
.ptitle::placeholder{color:var(--text-faint)}
.tabs{display:flex;align-items:flex-end;gap:2px;box-shadow:inset 0 -1px 0 var(--border);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:9px 14px 10px;font-weight:600;font-size:14.5px;color:var(--text-dim);white-space:nowrap;flex:none}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
.tab.add{color:var(--text-faint);font-weight:500}
.tabbar-tools{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.tabname{border:0;background:transparent;outline:none;font-weight:700;font-size:18px;padding:4px 0;min-width:0;flex:1}
.saved{font-size:12.5px;color:var(--text-faint)}
.editor{width:100%;min-height:360px;border:0;background:transparent;outline:none;resize:none;font-size:15.5px;line-height:1.8;padding:0;overflow:hidden}
.editor::placeholder{color:var(--text-faint)}
/* 카드 */
.cards-zone{display:flex;flex-direction:column;gap:10px;margin-top:-6px;min-height:34px}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:start}
@media (max-width:1040px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{border:0;text-align:left;border-radius:9px;padding:8px 10px 9px;display:flex;flex-direction:column;gap:2px;background:var(--cbg);color:var(--cfg);transition:transform .12s;min-width:0}
.card:hover{transform:translateY(-1px)}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
.card .chead{display:flex;align-items:flex-start;gap:5px;min-width:0}
.card .emo{font-size:14px;line-height:1.3;flex:none}
.card .emo:empty{display:none}
.card .ct{font-weight:700;font-size:13px;line-height:1.4;overflow-wrap:anywhere;min-width:0}
.card .cb{font-size:12px;line-height:1.45;opacity:.9;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .cb:empty{display:none}
.add-card{align-self:flex-start;border:1px dashed var(--border);background:transparent;color:var(--text-faint);border-radius:9px;padding:5px 12px;font-size:13.5px;font-weight:500;opacity:0;transition:opacity .12s}
.cards-zone:hover .add-card,.add-card:focus-visible{opacity:1}
.cards-zone.none .add-card{opacity:.001}
.cards-zone.none:hover .add-card{opacity:1}
@media (hover:none){.add-card{opacity:1!important}}
.add-card:hover{color:var(--accent);border-color:var(--accent)}
.card-limit{font-size:12.5px;color:var(--text-faint);opacity:0}
.cards-zone:hover .card-limit{opacity:1}
[data-c="gray"]{--cbg:var(--c-gray-bg);--cfg:var(--c-gray-fg)}
[data-c="green"]{--cbg:var(--c-green-bg);--cfg:var(--c-green-fg)}
[data-c="blue"]{--cbg:var(--c-blue-bg);--cfg:var(--c-blue-fg)}
[data-c="yellow"]{--cbg:var(--c-yellow-bg);--cfg:var(--c-yellow-fg)}
[data-c="orange"]{--cbg:var(--c-orange-bg);--cfg:var(--c-orange-fg)}
[data-c="red"]{--cbg:var(--c-red-bg);--cfg:var(--c-red-fg)}
[data-c="purple"]{--cbg:var(--c-purple-bg);--cfg:var(--c-purple-fg)}

/* 팝업 */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(15,18,14,.42);display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:var(--surface);color:var(--text);border-radius:16px;box-shadow:0 24px 60px -20px rgba(0,0,0,.45);width:100%;max-width:440px;max-height:calc(100% - 32px);overflow-y:auto;padding:22px 22px 18px;display:flex;flex-direction:column;gap:18px}
.dialog h3{margin:0;font-size:17px;font-weight:700}
.fgroup{display:flex;flex-direction:column;gap:8px}
.flabel{font-size:13px;font-weight:600;color:var(--text-dim);display:flex;justify-content:space-between}
.flabel .cnt{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--text-faint);font-variant-numeric:tabular-nums}
.flabel .cnt.full{color:var(--danger)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid transparent;background:var(--cbg);box-shadow:inset 0 0 0 1px var(--border);display:inline-flex;align-items:center;justify-content:center;color:var(--cfg);font-size:14px;font-weight:700;padding:0}
.sw[aria-checked="true"]{border-color:var(--cfg)}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emo-btn{border:1px solid transparent;background:transparent;border-radius:8px;height:36px;font-size:19px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.emo-btn:hover{background:var(--surface-2)}
.emo-btn[aria-checked="true"]{background:var(--accent-tint);border-color:var(--accent)}
.emo-btn.none{font-size:12px;color:var(--text-faint)}
textarea.field{resize:vertical;min-height:72px;line-height:1.6}
.dfoot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);padding-top:14px}
.dfoot .sp{flex:1}
.preview-wrap{display:flex;justify-content:center;padding:4px 0}
.preview-wrap .card{width:152px;cursor:default}
.preview-wrap .card:hover{transform:none}

.pagefoot{display:flex;justify-content:flex-end;border-top:1px solid var(--border);padding-top:14px}
</style>
</head>
<body>
<div class="app">

  <!-- 좌측 GNB -->
  <nav class="gnb" aria-label="프로젝트 목록">
    <div class="brand">
      <div class="eyebrow">프로젝트 노트</div>
      <h1>By Product</h1>
    </div>
    <div class="create">
      <input class="field" id="newName" placeholder="새 프로젝트 이름" autocomplete="off" aria-label="새 프로젝트 이름">
      <button class="btn primary" type="button" id="createBtn">만들기</button>
    </div>
    <div class="list-label"><span class="lbl">프로젝트 목록</span><span id="count"></span>
      <button class="more" id="listMore" type="button" aria-label="프로젝트 목록 더보기" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 16 16"><circle cx="3" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="13" cy="8" r="1.5"/></svg></button>
    </div>
    <ul class="plist" id="plist"></ul>
    <div class="side-empty" id="sideEmpty">아직 프로젝트가 없어요.</div>
    <div class="drag-hint" id="dragHint" hidden>항목을 끌어서 순서를 바꿀 수 있어요.</div>
  </nav>

  <!-- 우측 본문 -->
  <main class="main">
    <div class="welcome" id="welcome">
      <h2 id="welcomeTitle">프로젝트를 선택하세요</h2>
      <p id="welcomeText">왼쪽 목록에서 프로젝트를 누르면 여기에 탭별 내용이 열려요.</p>
    </div>

    <section class="page" id="page" hidden>
      <input class="ptitle" id="pTitle" placeholder="제목 없음" aria-label="프로젝트 이름">
      <div class="cards-zone" id="cardsZone">
        <div class="cards" id="cards"></div>
        <button class="add-card" id="addCard" type="button">+ 카드 추가</button>
        <span class="card-limit" id="cardLimit" hidden>카드는 최대 5개까지 추가할 수 있어요.</span>
      </div>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="tabbar-tools" id="tabTools">
        <input class="tabname" id="tabName" aria-label="탭 이름" placeholder="탭 이름">
        <span class="saved" id="saved"></span>
        <button class="btn ghost danger" id="delTab" type="button">탭 삭제</button>
      </div>
      <textarea class="editor" id="editor" placeholder="여기에 알아본 내용을 자유롭게 적으세요. 입력하면 자동으로 저장돼요."></textarea>
      <div class="pagefoot"><button class="btn ghost danger" id="delProject" type="button">프로젝트 삭제</button></div>
    </section>
  </main>

</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const KEY = 'byproduct.v2';
  const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

  // 데이터: { projects: [...] } — 배열 순서 = GNB 표시 순서 (새 프로젝트는 맨 아래에 추가)
  let data = { projects: [] };
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (d && Array.isArray(d.projects)) {
      data = d;
      // 이전 버전 데이터는 한 번만 생성 순서로 정렬해 둠
      if (!d.ordered) { data.projects.sort((a,b) => (a.createdAt||0) - (b.createdAt||0)); data.ordered = true; }
    }
  } catch(e) {}
  data.ordered = true;
  // 기본 '개요' 탭 정리: 내용 없이 남아 있는 '개요' 탭은 제거
  data.projects.forEach(p => {
    if (p.type === 'divider') return;
    if (!Array.isArray(p.tabs)) p.tabs = [];
    if (!Array.isArray(p.cards)) p.cards = [];
    if (!data.noDefaultTab) p.tabs = p.tabs.filter(t => !(t.name === '개요' && !(t.body || '').trim()));
  });
  data.noDefaultTab = true;

  let saveT;
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(data)); $('#saved').textContent = '저장됨'; }
    catch(e){ $('#saved').textContent = '저장하지 못했어요'; }
  }
  function saveSoon(){ $('#saved').textContent = '저장 중…'; clearTimeout(saveT); saveT = setTimeout(save, 400); }

  const isDiv = x => x.type === 'divider';
  const projectsOnly = () => data.projects.filter(x => !isDiv(x));
  const find = id => data.projects.find(p => p.id === id && !isDiv(p));
  function armed(btn, label, fn){
    if (btn.dataset.armed){ delete btn.dataset.armed; btn.classList.remove('armed'); btn.textContent = btn.dataset.old; fn(); return; }
    btn.dataset.old = btn.textContent; btn.dataset.armed = '1'; btn.textContent = label; btn.classList.add('armed');
    setTimeout(() => { if (btn.dataset.armed){ delete btn.dataset.armed; btn.textContent = btn.dataset.old; btn.classList.remove('armed'); } }, 3000);
  }
  function resetArmed(){ document.querySelectorAll('[data-armed]').forEach(b => { b.textContent = b.dataset.old; delete b.dataset.armed; b.classList.remove('armed'); }); }

  let cur = null;

  // ---------- 화면 전환 (#p-아이디) ----------
  function route(){
    resetArmed();
    const m = location.hash.match(/^#p-(.+)$/);
    const p = m && find(m[1]);
    cur = p || null;
    renderGnb();
    if (p) showPage(p); else showWelcome();
  }
  window.addEventListener('hashchange', route);

  // ---------- 더보기 메뉴 ----------
  const MORE_SVG = '<svg viewBox="0 0 16 16"><circle cx="3" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="13" cy="8" r="1.5"/></svg>';
  const ICONS = {
    divider: '<svg viewBox="0 0 16 16"><path d="M2 8h12"/></svg>',
    pin: '<svg viewBox="0 0 16 16"><path d="M6 2h4l-.6 4 2.6 2.4H4L6.6 6z"/><path d="M8 8.4V14"/></svg>',
    unpin: '<svg viewBox="0 0 16 16"><path d="M6 2h4l-.6 4 2.6 2.4H4L6.6 6z"/><path d="M8 8.4V14M2 2l12 12"/></svg>',
    trash: '<svg viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg>'
  };
  let openMenu = null;
  function closeMenu(){ if (!openMenu) return; openMenu.btn.setAttribute('aria-expanded','false'); openMenu.el.remove(); openMenu = null; }
  function showMenu(btn, items){
    const same = openMenu && openMenu.btn === btn; closeMenu(); if (same) return;
    const el = document.createElement('div'); el.className = 'menu'; el.setAttribute('role','menu');
    items.forEach(it => {
      const b = document.createElement('button'); b.type='button'; b.setAttribute('role','menuitem'); if (it.danger) b.className='danger';
      b.innerHTML = ICONS[it.icon] || ''; b.append(document.createTextNode(it.label));
      b.addEventListener('click', e => { e.stopPropagation(); closeMenu(); it.run(); });
      el.append(b);
    });
    document.body.append(el);
    const r = btn.getBoundingClientRect(), w = el.offsetWidth, hgt = el.offsetHeight;
    let left = Math.min(r.left, window.innerWidth - w - 8), top = r.bottom + 4;
    if (top + hgt > window.innerHeight - 8) top = r.top - hgt - 4;
    el.style.left = Math.max(8, left) + 'px'; el.style.top = Math.max(8, top) + 'px';
    btn.setAttribute('aria-expanded','true');
    openMenu = { btn, el };
    el.querySelector('button')?.focus();
  }
  document.addEventListener('pointerdown', e => { if (openMenu && !openMenu.el.contains(e.target) && !openMenu.btn.contains(e.target)) closeMenu(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && openMenu){ const b = openMenu.btn; closeMenu(); b.focus(); } });
  window.addEventListener('resize', closeMenu);
  $('.gnb').addEventListener('scroll', closeMenu);

  // 프로젝트 목록 제목 옆 더보기
  $('#listMore').addEventListener('click', e => {
    e.stopPropagation();
    showMenu(e.currentTarget, [{ icon:'divider', label:'구분선 추가', run: () => { data.projects.push({ id: uid('d_'), type:'divider' }); save(); renderGnb(); } }]);
  });

  // 항목별 메뉴: 설정 상태에 따라 노출 메뉴가 달라짐
  function itemMenu(x){
    if (isDiv(x)) return [{ icon:'trash', label:'구분선 삭제', danger:true, run: () => { data.projects = data.projects.filter(y => y !== x); save(); renderGnb(); } }];
    return x.pinned
      ? [{ icon:'unpin', label:'상단 고정 해제', run: () => { delete x.pinned; save(); renderGnb(); } }]
      : [{ icon:'pin', label:'상단 고정', run: () => { x.pinned = true; save(); renderGnb(); } }];
  }

  // ---------- GNB ----------
  // 표시 순서: 상단 고정 프로젝트(고정 그룹) → 나머지 프로젝트와 구분선. 고정 해제 시 원래 자리로 돌아감.
  const groupOf = x => (!isDiv(x) && x.pinned) ? 'pinned' : 'rest';
  function renderGnb(){
    closeMenu();
    const ul = $('#plist'); ul.replaceChildren();
    const projs = projectsOnly();
    $('#sideEmpty').hidden = data.projects.length > 0;
    $('#dragHint').hidden = data.projects.length < 2;
    $('#count').textContent = projs.length ? `${projs.length}개` : '';
    const pinned = data.projects.filter(x => groupOf(x) === 'pinned');
    const rest = data.projects.filter(x => groupOf(x) === 'rest');
    let no = 0;
    if (pinned.length){
      ul.append(Object.assign(document.createElement('li'), { className:'group-label', textContent:'고정됨' }));
      pinned.forEach(x => ul.append(itemEl(x, ++no, 'pinned')));
      if (rest.length) ul.append(Object.assign(document.createElement('li'), { className:'group-gap' }));
    }
    rest.forEach(x => ul.append(itemEl(x, isDiv(x) ? 0 : ++no, 'rest')));
  }
  function itemEl(x, no, group){
    const li = document.createElement('li'); li.dataset.id = x.id; li.dataset.group = group;
    const grip = document.createElement('span'); grip.className = 'grip'; grip.textContent = '⋮⋮'; grip.title = '끌어서 순서 변경'; grip.setAttribute('aria-hidden','true');
    const more = document.createElement('button'); more.type='button'; more.className='more'; more.innerHTML = MORE_SVG;
    more.setAttribute('aria-haspopup','menu'); more.setAttribute('aria-expanded','false');
    more.addEventListener('click', e => { e.stopPropagation(); showMenu(more, itemMenu(x)); });
    more.addEventListener('pointerdown', e => e.stopPropagation());
    li.addEventListener('pointerdown', e => startDrag(e, li));

    if (isDiv(x)){
      li.className = 'pitem divider';
      const rule = document.createElement('span'); rule.className = 'rule';
      more.setAttribute('aria-label','구분선 더보기');
      li.append(grip, rule, more);
      return li;
    }
    const active = cur && cur.id === x.id;
    li.className = 'pitem' + (active ? ' active' : '');
    const b = document.createElement('button'); b.type = 'button'; b.className = 'pbtn';
    if (active) b.setAttribute('aria-current', 'page');
    const n = document.createElement('span'); n.className = 'no'; n.textContent = no;
    const name = document.createElement('span'); name.className = 'name'; name.textContent = x.name || '제목 없음';
    b.append(n, name);
    if (x.pinned){ const s = document.createElementNS('http://www.w3.org/2000/svg','svg'); s.setAttribute('viewBox','0 0 16 16'); s.setAttribute('class','pin'); s.setAttribute('aria-label','고정됨'); s.innerHTML = '<path d="M6 1.5h4l-.6 4.2 2.8 2.6H3.8l2.8-2.6z"/><rect x="7.3" y="8" width="1.4" height="6.5" rx=".7"/>'; b.append(s); }
    b.addEventListener('click', () => { location.hash = 'p-' + x.id; });
    b.addEventListener('keydown', e => { // 키보드: Alt + ↑/↓ 로 같은 그룹 안에서 이동
      if (!e.altKey || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
      e.preventDefault();
      const g = data.projects.filter(y => groupOf(y) === group);
      const i = g.indexOf(x), j = i + (e.key === 'ArrowUp' ? -1 : 1);
      if (j < 0 || j >= g.length) return;
      [g[i], g[j]] = [g[j], g[i]]; applyGroupOrder(group, g); save(); renderGnb();
      document.querySelector(`#plist li[data-id="${x.id}"] .pbtn`)?.focus();
    });
    more.setAttribute('aria-label', `${x.name || '프로젝트'} 더보기`);
    li.append(grip, b, more);
    return li;
  }
  // 한 그룹의 새 순서를 전체 배열 중 그 그룹이 차지하던 자리에 채워 넣음 (다른 그룹 위치는 그대로)
  function applyGroupOrder(group, ordered){
    let k = 0;
    data.projects = data.projects.map(y => groupOf(y) === group ? ordered[k++] : y);
  }

  // ---------- 드래그 앤 드롭 (마우스: 줄 어디서나 / 터치: ⋮⋮ 손잡이) — 같은 그룹 안에서만 ----------
  let drag = null, suppressClick = false;
  function startDrag(e, li){
    if (e.button !== 0) return;
    const onGrip = e.target.closest('.grip');
    if (e.pointerType !== 'mouse' && !onGrip) return;
    drag = { li, group: li.dataset.group, startY: e.clientY, active: false, pid: e.pointerId };
    if (onGrip) e.preventDefault();
  }
  window.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.pid) return;
    if (!drag.active){
      if (Math.abs(e.clientY - drag.startY) < 5) return;
      closeMenu();
      drag.active = true; drag.li.classList.add('dragging'); $('#plist').classList.add('sorting');
    }
    e.preventDefault();
    const ul = $('#plist');
    const same = [...ul.children].filter(x => x.dataset.group === drag.group);
    const others = same.filter(x => x !== drag.li);
    let before = null;
    for (const o of others){ const r = o.getBoundingClientRect(); if (e.clientY < r.top + r.height / 2){ before = o; break; } }
    if (before){ if (before !== drag.li.nextElementSibling) ul.insertBefore(drag.li, before); }
    else { const last = others[others.length - 1]; if (last && last.nextElementSibling !== drag.li) last.after(drag.li); }
    let n = 0; [...ul.children].forEach(x => { const el = x.querySelector('.no'); if (el) el.textContent = ++n; });
  }, { passive: false });
  function endDrag(){
    if (!drag) return;
    const d = drag; drag = null;
    if (!d.active) return;
    suppressClick = true; setTimeout(() => suppressClick = false, 0);
    d.li.classList.remove('dragging'); $('#plist').classList.remove('sorting');
    const byId = new Map(data.projects.map(y => [y.id, y]));
    const ordered = [...$('#plist').children].filter(x => x.dataset.group === d.group).map(x => byId.get(x.dataset.id)).filter(Boolean);
    applyGroupOrder(d.group, ordered);
    save(); renderGnb();
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
  document.addEventListener('click', e => { if (suppressClick && e.target.closest('#plist')){ e.stopPropagation(); e.preventDefault(); } }, true);

  function createProject(){
    const input = $('#newName');
    const name = input.value.trim(); if (!name) { input.focus(); return; }
    const p = { id: uid('p_'), name, createdAt: Date.now(), updatedAt: Date.now(), activeTab: null, tabs: [], cards: [] };
    data.projects.push(p); // 새 프로젝트는 맨 아래
    save(); input.value = '';
    location.hash = 'p-' + p.id;
    if (!location.hash.endsWith(p.id)) route();
  }
  $('#createBtn').addEventListener('click', createProject);
  $('#newName').addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return; // 한글 입력 중 Enter는 무시
    e.preventDefault(); createProject();
  });

  // ---------- 본문 ----------
  function showWelcome(){
    $('#page').hidden = true; $('#welcome').hidden = false;
    const none = projectsOnly().length === 0;
    $('#welcomeTitle').textContent = none ? '첫 프로젝트를 만들어 보세요' : '프로젝트를 선택하세요';
    $('#welcomeText').textContent = none ? '왼쪽 위에 프로젝트 이름을 적고 만들기를 누르면 목록에 추가되고 바로 열려요.' : '왼쪽 목록에서 프로젝트를 누르면 여기에 탭별 내용이 열려요.';
  }
  const activeTab = () => cur.tabs.find(t => t.id === cur.activeTab) || cur.tabs[0] || null;
  const touch = () => { cur.updatedAt = Date.now(); }; // 수정 일시만 기록, 목록 순서는 바꾸지 않음

  function showPage(p){
    $('#welcome').hidden = true; $('#page').hidden = false;
    $('#pTitle').value = p.name;
    $('#saved').textContent = '';
    renderCards(); renderTabs(); loadTab();
    window.scrollTo({ top: 0 });
  }
  function renderTabs(){
    const bar = $('#tabs'); bar.replaceChildren();
    const at = activeTab();
    cur.tabs.forEach(t => {
      const b = document.createElement('button'); b.type='button'; b.className='tab'; b.setAttribute('role','tab');
      b.setAttribute('aria-selected', String(!!at && t.id === at.id)); b.textContent = t.name || '제목 없음';
      b.addEventListener('click', () => { cur.activeTab = t.id; save(); renderTabs(); loadTab(); });
      bar.append(b);
    });
    const add = document.createElement('button'); add.type='button'; add.className='tab add'; add.textContent='+ 새 탭';
    add.addEventListener('click', () => {
      const t = { id: uid('t_'), name: '새 탭', body: '' };
      cur.tabs.push(t); cur.activeTab = t.id; touch(); save(); renderTabs(); loadTab();
      const n = $('#tabName'); n.focus(); n.select();
    });
    bar.append(add);

  }
  function loadTab(){
    const t = activeTab();
    const has = !!t;
    $('#tabTools').hidden = !has; $('#editor').hidden = !has;
    if (!has) return;
    $('#tabName').value = t.name;
    $('#editor').value = t.body || '';
    grow();
  }
  function grow(){ const e = $('#editor'); e.style.height = 'auto'; e.style.height = Math.max(360, e.scrollHeight) + 'px'; }

  $('#pTitle').addEventListener('input', e => {
    cur.name = e.target.value; touch(); saveSoon();
    const n = document.querySelector('#plist .pitem.active .name'); if (n) n.textContent = e.target.value || '제목 없음';
  });
  $('#tabName').addEventListener('input', e => {
    if (!activeTab()) return;
    activeTab().name = e.target.value; touch(); saveSoon();
    const sel = $('#tabs [aria-selected="true"]'); if (sel) sel.textContent = e.target.value || '제목 없음';
  });
  $('#editor').addEventListener('input', e => { if (!activeTab()) return; activeTab().body = e.target.value; touch(); grow(); saveSoon(); });
  $('#delTab').addEventListener('click', e => armed(e.currentTarget, '한 번 더 누르면 삭제', () => {
    const t = activeTab(); if (!t) return;
    cur.tabs = cur.tabs.filter(x => x.id !== t.id); cur.activeTab = cur.tabs[0] ? cur.tabs[0].id : null;
    touch(); save(); renderTabs(); loadTab();
  }));
  $('#delProject').addEventListener('click', e => armed(e.currentTarget, '한 번 더 누르면 프로젝트 삭제', () => {
    data.projects = data.projects.filter(p => p.id !== cur.id); save(); location.hash = '';
    if (location.hash) route(); else route();
  }));
  // ---------- 카드 ----------
  const MAX_CARDS = 5, MAX_TITLE = 10, MAX_BODY = 50;
  const COLORS = [['gray','회색'],['green','초록'],['blue','파랑'],['yellow','노랑'],['orange','주황'],['red','빨강'],['purple','보라']];
  const EMOJIS = ['📌','💡','📊','🎯','✅','⚠️','🚀','🧩','📝','💰','👥','🔍','📅','⭐','🔥','🛠️','📈','📣','🤝','🏁','❓','🔒','🌱'];
  const clip = (v, n) => Array.from(v).slice(0, n).join('');
  const len = v => Array.from(v).length;

  function cardEl(c, onClick){
    const el = document.createElement(onClick ? 'button' : 'div'); if (onClick){ el.type='button'; el.addEventListener('click', onClick); }
    el.className = 'card'; el.dataset.c = c.color || 'gray';
    const e = document.createElement('span'); e.className='emo'; e.textContent = c.emoji || '';
    const t = document.createElement('span'); t.className='ct'; t.textContent = c.title || '카드명';
    const b = document.createElement('span'); b.className='cb'; b.textContent = c.body || '';
    const hd = document.createElement('span'); hd.className='chead'; hd.append(e, t);
    el.append(hd, b); el.title = [c.title, c.body].filter(Boolean).join('\n');
    if (onClick) el.setAttribute('aria-label', `${c.title} 카드 수정`);
    return el;
  }
  function renderCards(){
    const wrap = $('#cards'); wrap.replaceChildren();
    const cards = cur.cards || (cur.cards = []);
    cards.forEach(c => wrap.append(cardEl(c, () => openCardDialog(c))));
    wrap.hidden = cards.length === 0;
    $('#cardsZone').classList.toggle('none', cards.length === 0);
    const full = cards.length >= MAX_CARDS;
    $('#addCard').hidden = full; $('#cardLimit').hidden = !full;
  }
  $('#addCard').addEventListener('click', () => { if ((cur.cards || []).length < MAX_CARDS) openCardDialog(null); });

  function openCardDialog(card){
    const isNew = !card;
    const st = { color: card ? card.color : 'green', emoji: card ? card.emoji : '📌', title: card ? card.title : '', body: card ? card.body : '' };
    const last = document.activeElement;
    const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = `
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
        <h3 id="dlgTitle">${isNew ? '카드 추가' : '카드 수정'}</h3>
        <div class="preview-wrap" id="dlgPreview"></div>
        <div class="fgroup"><div class="flabel"><span id="lblColor">카드 색상</span></div><div class="swatches" role="radiogroup" aria-labelledby="lblColor" id="dlgColors"></div></div>
        <div class="fgroup"><div class="flabel"><span id="lblEmo">카드 이모티콘</span></div><div class="emojis" role="radiogroup" aria-labelledby="lblEmo" id="dlgEmojis"></div></div>
        <div class="fgroup"><label class="flabel" for="dlgName"><span>카드명</span><span class="cnt" id="cntName"></span></label>
          <input class="field" id="dlgName" maxlength="${MAX_TITLE}" autocomplete="off" placeholder="최대 ${MAX_TITLE}자"></div>
        <div class="fgroup"><label class="flabel" for="dlgBody"><span>카드 본문 내용</span><span class="cnt" id="cntBody"></span></label>
          <textarea class="field" id="dlgBody" maxlength="${MAX_BODY}" placeholder="최대 ${MAX_BODY}자"></textarea></div>
        <div class="dfoot">
          ${isNew ? '' : '<button class="btn ghost danger" type="button" id="dlgDel">삭제</button>'}
          <span class="sp"></span>
          <button class="btn" type="button" id="dlgCancel">취소</button>
          <button class="btn primary" type="button" id="dlgSave">${isNew ? '추가' : '저장'}</button>
        </div>
      </div>`;
    document.body.append(ov);
    const q = s => ov.querySelector(s);
    const name = q('#dlgName'), body = q('#dlgBody');
    name.value = st.title; body.value = st.body;

    function preview(){ q('#dlgPreview').replaceChildren(cardEl({ ...st, title: st.title || '카드명', body: st.body || '본문 내용이 여기에 보여요.' })); }
    function counts(){
      const a = len(name.value), b = len(body.value);
      q('#cntName').textContent = `${a}/${MAX_TITLE}`; q('#cntName').classList.toggle('full', a >= MAX_TITLE);
      q('#cntBody').textContent = `${b}/${MAX_BODY}`; q('#cntBody').classList.toggle('full', b >= MAX_BODY);
    }
    COLORS.forEach(([k, label]) => {
      const b = document.createElement('button'); b.type='button'; b.className='sw'; b.dataset.c = k; b.title = label;
      b.setAttribute('role','radio'); b.setAttribute('aria-label', label);
      b.addEventListener('click', () => { st.color = k; syncSel(); preview(); });
      q('#dlgColors').append(b);
    });
    ['', ...EMOJIS].forEach(em => {
      const b = document.createElement('button'); b.type='button'; b.className = 'emo-btn' + (em ? '' : ' none');
      b.textContent = em || '없음'; b.dataset.e = em; b.setAttribute('role','radio'); b.setAttribute('aria-label', em || '이모티콘 없음');
      b.addEventListener('click', () => { st.emoji = em; syncSel(); preview(); });
      q('#dlgEmojis').append(b);
    });
    function syncSel(){
      ov.querySelectorAll('.sw').forEach(b => { const on = b.dataset.c === st.color; b.setAttribute('aria-checked', String(on)); b.textContent = on ? '✓' : ''; });
      ov.querySelectorAll('.emo-btn').forEach(b => b.setAttribute('aria-checked', String(b.dataset.e === st.emoji)));
    }
    // 글자 수 제한 (한글 조합 중에도 넘치지 않게 조합이 끝나면 자름)
    function limit(el, max, key){
      const apply = () => { if (len(el.value) > max) el.value = clip(el.value, max); st[key] = el.value; counts(); preview(); };
      el.addEventListener('input', e => { if (!e.isComposing) apply(); else { st[key] = clip(el.value, max); counts(); preview(); } });
      el.addEventListener('compositionend', apply);
    }
    limit(name, MAX_TITLE, 'title'); limit(body, MAX_BODY, 'body');
    syncSel(); counts(); preview();

    function close(){ ov.remove(); document.removeEventListener('keydown', onKey, true); if (last && last.isConnected) last.focus(); }
    function onKey(e){
      if (e.key === 'Escape'){ e.stopPropagation(); close(); }
      if (e.key === 'Tab'){ // 포커스를 팝업 안에 가둠
        const f = [...ov.querySelectorAll('button,input,textarea')].filter(x => !x.disabled);
        const i = f.indexOf(document.activeElement);
        if (e.shiftKey && i <= 0){ e.preventDefault(); f[f.length-1].focus(); }
        else if (!e.shiftKey && i === f.length - 1){ e.preventDefault(); f[0].focus(); }
      }
    }
    document.addEventListener('keydown', onKey, true);
    ov.addEventListener('pointerdown', e => { if (e.target === ov) close(); });
    q('#dlgCancel').addEventListener('click', close);
    q('#dlgSave').addEventListener('click', () => {
      const title = clip(name.value.trim(), MAX_TITLE), text = clip(body.value.trim(), MAX_BODY);
      if (!title){ name.focus(); name.placeholder = '카드명을 입력해 주세요'; name.style.borderColor = 'var(--danger)'; return; }
      if (isNew){
        if (cur.cards.length >= MAX_CARDS){ close(); return; }
        cur.cards.push({ id: uid('c_'), color: st.color, emoji: st.emoji, title, body: text });
      } else Object.assign(card, { color: st.color, emoji: st.emoji, title, body: text });
      touch(); save(); renderCards(); close();
    });
    const del = q('#dlgDel');
    if (del) del.addEventListener('click', e => armed(e.currentTarget, '한 번 더 누르면 삭제', () => {
      cur.cards = cur.cards.filter(c => c !== card); touch(); save(); renderCards(); close();
    }));
    setTimeout(() => name.focus(), 0);
  }

  window.addEventListener('beforeunload', () => { clearTimeout(saveT); save(); });

  route();
})();
</script>
</body>
</html>
